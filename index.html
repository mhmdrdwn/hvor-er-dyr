<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="theme-color" content="#cfeefc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --ink: #4a3f5c;
    --card: #fffaf2;
    --shadow: 0 6px 0 rgba(74, 63, 92, .15);
    --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, sans-serif;
    color: var(--ink); background: #cfeefc;
  }
  button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; }
  .screen { position: fixed; inset: 0; display: none; }
  .screen.on { display: block; }

  /* ---------- Menu ---------- */
  #menu {
    background: linear-gradient(#cfeefc 0 50%, #b9e08f 50%);
    display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 3.5vmin; padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  }
  #menu.on { display: flex; }
  #menu h1 { margin: 0; font-size: clamp(28px, 7vmin, 60px); text-align: center; letter-spacing: .5px; }
  #menu h1 .paw { display: inline-block; animation: breathe 2.4s ease-in-out infinite; }
  .cards { display: grid; grid-template-columns: repeat(3, auto); gap: 3vmin; }
  @media (orientation: portrait) { .cards { grid-template-columns: repeat(2, auto); } }
  .card {
    width: clamp(104px, 21vmin, 190px); aspect-ratio: 1; border-radius: 26px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: var(--shadow); transition: transform .12s;
    font-size: clamp(15px, 3vmin, 24px); font-weight: 700;
  }
  @media (orientation: portrait) { .card { width: clamp(120px, 34vmin, 200px); } }
  .card:active { transform: scale(.94); }
  .card .e { font-family: var(--emoji); font-size: 2.6em; line-height: 1.1; }
  .parent { display: flex; align-items: center; gap: 8px; font-size: 15px; opacity: .85; flex-wrap: wrap; justify-content: center; }
  .parent input {
    font: inherit; font-size: 16px; padding: 10px 14px; border-radius: 14px;
    border: 2px solid rgba(74,63,92,.2); background: var(--card); width: 170px; color: var(--ink);
    -webkit-user-select: text; user-select: text;
  }
  #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 12vmin; font-family: var(--emoji); }
  #loading span { animation: breathe 1s ease-in-out infinite; }

  /* ---------- Scene backgrounds ---------- */
  #scene { overflow: hidden; }
  #stage { position: absolute; inset: 0; }
  .bg-farm {
    background:
      radial-gradient(ellipse 15% 6% at 18% 84%, #a9dcf2 96%, transparent 100%),
      radial-gradient(ellipse 70% 22% at 22% 52%, #b6de8c 98%, transparent 100%),
      radial-gradient(ellipse 60% 20% at 82% 52%, #a8d67e 98%, transparent 100%),
      linear-gradient(#cfeefc 0 50%, #9fd27a 50%);
  }
  .bg-forest {
    background:
      radial-gradient(ellipse 30% 10% at 30% 66%, #92c98a 96%, transparent 100%),
      radial-gradient(ellipse 35% 10% at 75% 88%, #79b572 96%, transparent 100%),
      linear-gradient(#d9f0e4 0 47%, #86c07f 47%);
  }
  .bg-home {
    background:
      radial-gradient(ellipse 34% 9% at 52% 84%, #f3cdc8 96%, transparent 100%),
      repeating-linear-gradient(90deg, transparent 0 11vw, rgba(0,0,0,.035) 11vw calc(11vw + 3px)),
      linear-gradient(#f8e7d4 0 64%, #dcb893 64%);
  }
  .bg-jungle {
    background:
      radial-gradient(ellipse 70% 14% at 50% 0%, #7dbb6c 96%, transparent 100%),
      radial-gradient(ellipse 40% 12% at 20% 72%, #9bcf7d 96%, transparent 100%),
      radial-gradient(ellipse 30% 10% at 80% 86%, #6fae5f 96%, transparent 100%),
      linear-gradient(#e3f4d2 0 48%, #86c46e 48%);
  }
  .bg-sea {
    background:
      radial-gradient(ellipse 60% 12% at 50% 100%, #f7e7bf 96%, transparent 100%),
      linear-gradient(#cfeefc 0 36%, #8fd0ec 36% 46%, #6cbde3 46% 74%, #f3dfb0 74%);
  }
  .bg-mountain {
    background:
      radial-gradient(ellipse 60% 16% at 70% 62%, #b8df98 96%, transparent 100%),
      linear-gradient(#d6ecfa 0 56%, #a3d284 56%);
  }

  /* ---------- Scene items ---------- */
  .item { position: absolute; transform: translate(-50%, -50%); font-family: var(--emoji); line-height: 1; }
  .decor { pointer-events: none; z-index: 1; }
  .decor.front { z-index: 3; }
  .animal { z-index: 2; padding: 2vmin; border-radius: 50%; touch-action: none; }
  .bob, .glyph { display: inline-block; }
  .glyph.flip { transform: scaleX(-1); }
  .animal .bob { animation: breathe 2.6s ease-in-out infinite; }
  .animal.move { transition: left 1s ease-in-out, top 1s ease-in-out; }
  .animal.wiggle .bob { animation: wiggle .6s ease-in-out; }
  .animal.hint .bob { animation: wiggle .7s ease-in-out 3; filter: drop-shadow(0 0 2.5vmin #fff6a8) drop-shadow(0 0 1vmin #ffe066); }
  .animal.celebrate { z-index: 4; }
  .animal.celebrate .bob { animation: celebrate 1.1s ease-in-out infinite; }
  .animal.found::after {
    content: "⭐"; position: absolute; top: -.1em; right: -.05em; font-size: .32em;
    animation: pop .4s ease-out;
  }

  .topbar {
    position: absolute; z-index: 10; left: 0; right: 0; top: 0;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 0 max(16px, env(safe-area-inset-left));
    pointer-events: none;
  }
  .topbar > * { pointer-events: auto; }
  .round {
    width: 64px; height: 64px; flex: none; border-radius: 50%; background: var(--card);
    box-shadow: var(--shadow); font-family: var(--emoji); font-size: 30px; position: relative;
  }
  .round:active { transform: scale(.94); }
  #homeBtn::before {
    content: ""; position: absolute; inset: -5px; border-radius: 50%;
    background: conic-gradient(#8bc6ff var(--p, 0%), transparent 0);
    z-index: -1;
  }
  #homeBtn.holding { animation: fill 1.2s linear forwards; }
  #homeBtn small {
    position: absolute; left: 50%; bottom: -20px; transform: translateX(-50%);
    font-family: system-ui, sans-serif; font-size: 11px; opacity: .6; white-space: nowrap;
  }
  #prompt {
    background: var(--card); border-radius: 999px; box-shadow: var(--shadow);
    padding: 12px 24px; font-size: clamp(20px, 4.4vmin, 36px); font-weight: 700;
    text-align: center; min-width: 0;
  }
  #prompt:empty { visibility: hidden; }
  #prompt.pulse { animation: pop .35s ease-out; }
  .progress {
    position: absolute; z-index: 10; left: 50%; transform: translateX(-50%);
    bottom: max(12px, env(safe-area-inset-bottom));
    display: flex; gap: 10px; padding: 8px 14px; border-radius: 999px; background: rgba(255,250,242,.8);
  }
  .progress span {
    width: 40px; height: 40px; border-radius: 50%; background: rgba(74,63,92,.12);
    display: flex; align-items: center; justify-content: center; font-family: var(--emoji); font-size: 24px;
  }
  .progress span.done { background: #fff1b8; animation: pop .4s ease-out; }

  .sparkle {
    position: fixed; z-index: 20; pointer-events: none; font-family: var(--emoji);
    font-size: 5vmin; transform: translate(-50%, -50%);
    animation: fly .9s ease-out forwards;
  }

  /* ---------- Slutt ---------- */
  #end {
    background: linear-gradient(#3d4a7a, #6b5b95); color: #fffaf2;
    display: none; flex-direction: column; align-items: center; justify-content: center; gap: 4vmin;
    padding: 16px; text-align: center;
  }
  #end.on { display: flex; }
  #end .moon { font-family: var(--emoji); font-size: 20vmin; animation: breathe 3s ease-in-out infinite; }
  #end h2 { margin: 0; font-size: clamp(34px, 9vmin, 72px); }
  #endFriends { font-family: var(--emoji); font-size: 9vmin; display: flex; gap: 2vmin; flex-wrap: wrap; justify-content: center; }
  #endFriends span { display: inline-block; animation: celebrate 1.4s ease-in-out infinite; }
  .endBtns { display: flex; gap: 6vmin; }
  .endBtns .round { width: 96px; height: 96px; font-size: 46px; }

  @keyframes breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
  @keyframes wiggle {
    0%, 100% { transform: rotate(0); } 20% { transform: rotate(-14deg); }
    40% { transform: rotate(12deg); } 60% { transform: rotate(-8deg); } 80% { transform: rotate(6deg); }
  }
  @keyframes celebrate {
    0%, 100% { transform: translateY(0) scale(1); }
    25% { transform: translateY(-30%) scale(1.3) rotate(-8deg); }
    50% { transform: translateY(0) scale(1.1); }
    75% { transform: translateY(-20%) scale(1.25) rotate(8deg); }
  }
  @keyframes pop { 0% { transform: scale(.6); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
  @keyframes fly {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(.5); }
    100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.2); }
  }
  @property --p { syntax: "<percentage>"; inherits: false; initial-value: 0%; }
  @keyframes fill { to { --p: 100%; } }

  @media (prefers-reduced-motion: reduce) {
    .animal .bob, #menu h1 .paw, #end .moon { animation: none; }
  }
</style>
</head>
<body>

<div id="loading"><span>🐾</span></div>

<!-- Meny: velg et sted -->
<section id="menu" class="screen">
  <h1><span class="paw">🐾</span> <span id="title"></span></h1>
  <div id="cards" class="cards"></div>
  <label class="parent"><span id="nameLabel"></span>
    <input id="nameInput" type="text" maxlength="20" autocomplete="off">
  </label>
</section>

<!-- Scene: finn dyrene -->
<section id="scene" class="screen">
  <div class="topbar">
    <button id="homeBtn" class="round">🏠<small id="holdLabel"></small></button>
    <div id="prompt"></div>
    <button id="repeatBtn" class="round">🔊</button>
  </div>
  <div id="stage"></div>
  <div id="progress" class="progress"></div>
</section>

<!-- Slutt -->
<section id="end" class="screen">
  <div class="moon">🌙</div>
  <h2 id="endTitle"></h2>
  <div id="endFriends"></div>
  <div class="endBtns">
    <button id="againBtn" class="round">🔁</button>
    <button id="endHomeBtn" class="round">🏠</button>
  </div>
</section>

<script>
// All text, places, animals and sound sources live in content.json.
// The audio files in sounds/ and voice/ are made from it by tools/build_audio.py.
let C = null;

// ---------- Helpers ----------
const $ = (id) => document.getElementById(id);
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const shuffle = (arr) => arr.map((v) => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map((p) => p[1]);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const askText = (a) => `Hvor er ${a.the}?`;

function childName() {
  try { return (localStorage.getItem("childName") || "").trim(); } catch { return ""; }
}

// ---------- Audio ----------
// Everything plays through one Web Audio context: it is unlocked by the first tap,
// then clips can be chained without further taps (important on iPhone/iPad).
let ctx = null;
const buffers = new Map();   // path -> Promise<AudioBuffer|null>

function audioCtx() {
  if (!ctx) {
    try {
      // Play even when the iPhone's silent switch is on (Safari 17+).
      if (navigator.audioSession) navigator.audioSession.type = "playback";
      ctx = new (window.AudioContext || window.webkitAudioContext)();
    } catch { return null; }
  }
  if (ctx.state === "suspended") ctx.resume();
  return ctx;
}
// Call inside a tap handler: a silent blip unlocks audio on older iOS.
function unlockAudio() {
  const a = audioCtx(); if (!a) return;
  const src = a.createBufferSource();
  src.buffer = a.createBuffer(1, 1, 22050);
  src.connect(a.destination); src.start(0);
}

function load(path) {
  if (!buffers.has(path)) {
    const a = audioCtx();
    buffers.set(path, fetch(path)
      .then((r) => { if (!r.ok) throw new Error(path); return r.arrayBuffer(); })
      .then((data) => new Promise((ok, fail) => a.decodeAudioData(data, ok, fail)))
      .catch(() => null));
  }
  return buffers.get(path);
}
const sound = (id) => `sounds/${id}.m4a`;
const voice = (key) => `voice/${key}.m4a`;
const voiceText = {};  // voice file path -> its text (same naming as tools/build_audio.py)

let playing = null;  // the clip currently playing
let seq = 0;         // bumps on every new sequence, so older ones stop quietly

async function playClip(path) {
  const buf = await load(path);
  const a = audioCtx();
  // A narration file is missing: say the line with the device's Norwegian voice instead.
  if (!buf && voiceText[path]) return speakNb(voiceText[path]);
  if (!buf || !a) return;
  await new Promise((done) => {
    const src = a.createBufferSource();
    src.buffer = buf;
    src.connect(a.destination);
    src.onended = done;
    playing = src;
    src.start();
  });
}

// Norwegian text-to-speech: says the child's name (can't be pre-recorded),
// and stands in for any narration file that is missing.
let nbVoice = null;
function findNbVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices();
  nbVoice = vs.find((v) => /^(nb|no|nn)([-_]|$)/i.test(v.lang)) || null;
}
if ("speechSynthesis" in window) {
  findNbVoice();
  speechSynthesis.addEventListener?.("voiceschanged", findNbVoice);
}
function speakNb(text) {
  if (!nbVoice) return Promise.resolve();
  return new Promise((done) => {
    const u = new SpeechSynthesisUtterance(text);
    u.voice = nbVoice; u.lang = nbVoice.lang; u.rate = 0.9; u.pitch = 1.1;
    u.onend = done; u.onerror = done;
    setTimeout(done, 1500 + text.length * 90);
    speechSynthesis.speak(u);
  });
}

// Play a list of steps in order: file paths, {pause: ms} or {name: text}.
// Returns true if it ran to the end, false if something newer interrupted it.
async function say(steps) {
  const id = ++seq;
  stopAudio(false);
  for (const step of steps) {
    if (!step) continue;
    if (id !== seq) return false;
    if (step.pause) await wait(step.pause);
    else if (step.name) await speakNb(step.name);
    else await playClip(step);
  }
  return id === seq;
}
function stopAudio(bump = true) {
  if (bump) seq++;
  if (playing) { try { playing.onended = null; playing.stop(); } catch {} playing = null; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}
const nameStep = () => (childName() ? { name: childName() + "!" } : null);

// Small generated effects under the narration
function tone(freq, start, dur, type = "sine", vol = 0.1) {
  const a = audioCtx(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = freq;
  const t = a.currentTime + start;
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g).connect(a.destination);
  o.start(t); o.stop(t + dur + 0.05);
}
const chime = () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.09, 0.35, "triangle"));
const boop = () => { tone(392, 0, 0.18, "sine", 0.08); tone(330, 0.1, 0.22, "sine", 0.06); };
const tada = () => [523, 659, 784, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.13, 0.4, "triangle", 0.08));

// ---------- Screens ----------
function show(id) {
  document.querySelectorAll(".screen").forEach((s) => s.classList.toggle("on", s.id === id));
}

// ---------- Game ----------
let scene = null;     // current scene from content.json
let animals = [];     // copies of the scene's animals, each with .el
let order = [];       // the order we ask for them
let step = 0;
let busy = false;     // true while celebrating a correct tap
let hintTimers = [];

function placeItem(tag, cls, d) {
  const el = document.createElement(tag);
  el.className = "item " + cls;
  el.style.left = d.x + "%";
  el.style.top = d.y + "%";
  el.style.fontSize = d.s + "vmin";
  el.innerHTML = `<span class="bob" style="animation-delay:${(-Math.random() * 2).toFixed(2)}s"><span class="glyph${d.f ? " flip" : ""}">${d.e}</span></span>`;
  return el;
}

function sceneClips(sc) {
  return [voice("intro_" + sc.id), ...sc.animals.flatMap((a) =>
    [sound(a.id), voice("ask_" + a.id), voice("is_" + a.id), voice("line_" + a.id)])];
}

async function startScene(sc) {
  scene = sc;
  const stage = $("stage");
  stage.className = "bg-" + sc.id;
  stage.innerHTML = "";
  sc.decor.forEach((d) => stage.appendChild(placeItem("div", "decor" + (d.front ? " front" : ""), d)));

  animals = sc.animals.map((a) => ({ ...a }));
  animals.forEach((a) => {
    const el = placeItem("button", "animal", a);
    el.setAttribute("aria-label", a.the);
    el.addEventListener("pointerdown", (e) => { e.preventDefault(); onTap(a); });
    a.el = el;
    stage.appendChild(el);
  });

  order = shuffle(animals);
  step = 0;
  busy = true;  // no taps count until the question has been asked
  clearHints();
  $("progress").innerHTML = animals.map(() => "<span></span>").join("");
  $("prompt").textContent = "";
  show("scene");

  await Promise.all(sceneClips(sc).map(load));
  if (scene !== sc) return;
  if (await say([voice("intro_" + sc.id), { pause: 300 }])) { busy = false; ask(); }
}

function target() { return order[step]; }

function ask() {
  const t = target();
  if (!t) return;
  const p = $("prompt");
  p.textContent = askText(t);
  p.classList.remove("pulse"); void p.offsetWidth; p.classList.add("pulse");
  say([voice("ask_" + t.id)]);
  armHints();
}

function armHints() {
  clearHints();
  hintTimers.push(setTimeout(() => nudge(target()), 8000));
  hintTimers.push(setTimeout(() => { say([voice("ask_" + target().id)]); nudge(target()); }, 16000));
}
function clearHints() {
  hintTimers.forEach(clearTimeout);
  hintTimers = [];
  animals.forEach((a) => a.el && a.el.classList.remove("hint"));
}
function nudge(a) {
  if (!a || busy) return;
  a.el.classList.remove("hint"); void a.el.offsetWidth; a.el.classList.add("hint");
}
function wiggle(a) {
  a.el.classList.remove("wiggle"); void a.el.offsetWidth; a.el.classList.add("wiggle");
}

async function onTap(a) {
  audioCtx();
  if (busy) { wiggle(a); return; }
  const t = target();

  if (a === t) {
    const sc = scene;
    busy = true;
    clearHints();
    chime();
    sparkles(a.el);
    a.el.classList.add("celebrate");
    const praise = voice("praise_" + Math.floor(Math.random() * C.praise.length));
    const done = await say([{ pause: 350 }, praise, nameStep(), sound(a.id), { pause: 150 }, voice("line_" + a.id)]);
    a.el.classList.remove("celebrate");
    if (!done) return;
    a.el.classList.add("found");
    hopAside(a);
    const dot = $("progress").children[step];
    dot.textContent = a.e; dot.classList.add("done");
    step++;
    await wait(700);
    if (scene !== sc) return;
    busy = false;
    if (step < order.length) ask(); else finish();
    return;
  }

  // Not the one we asked for: no "wrong", just meet this animal and ask again.
  boop();
  wiggle(a);
  clearHints();
  const steps = a.el.classList.contains("found")
    ? [sound(a.id), { pause: 250 }, voice("ask_" + t.id)]
    : [sound(a.id), { pause: 150 }, voice("is_" + a.id), { pause: 300 }, voice("ask_" + t.id)];
  if (await say(steps)) armHints();
}

// The found animal takes a little walk so the scene feels alive.
function hopAside(a) {
  const dx = (a.x > 50 ? -1 : 1) * (4 + Math.random() * 4);
  a.x = Math.min(92, Math.max(8, a.x + dx));
  a.el.classList.add("move");
  a.el.style.left = a.x + "%";
}

function sparkles(el) {
  const r = el.getBoundingClientRect();
  const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  for (let i = 0; i < 10; i++) {
    const s = document.createElement("span");
    s.className = "sparkle";
    s.textContent = pick(["✨", "⭐", "💛", "🌟"]);
    const ang = (i / 10) * Math.PI * 2, dist = 60 + Math.random() * 60;
    s.style.left = cx + "px"; s.style.top = cy + "px";
    s.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    s.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }
}

function finish() {
  clearHints();
  $("endFriends").innerHTML = animals
    .map((a, i) => `<span style="animation-delay:${i * 0.15}s">${a.e}</span>`).join("");
  show("end");
  tada();
  say([{ pause: 600 }, voice("end_0"), nameStep(), { pause: 300 }, voice("end_1")]);
}

function goHome() {
  stopAudio();
  clearHints();
  busy = false;
  scene = null;
  show("menu");
}

// ---------- Start-up ----------
async function init() {
  C = await fetch("content.json").then((r) => r.json());
  C.praise.forEach((t, i) => (voiceText[voice("praise_" + i)] = t));
  C.end.forEach((t, i) => (voiceText[voice("end_" + i)] = t));
  C.scenes.forEach((sc) => {
    voiceText[voice("intro_" + sc.id)] = sc.intro;
    sc.animals.forEach((a) => {
      voiceText[voice("ask_" + a.id)] = askText(a);
      voiceText[voice("is_" + a.id)] = `Det er ${a.the}!`;
      voiceText[voice("line_" + a.id)] = a.line;
    });
  });
  const ui = C.ui;
  document.documentElement.lang = "nb";
  $("title").textContent = ui.title;
  $("nameLabel").textContent = ui.nameLabel;
  $("nameInput").placeholder = ui.namePlaceholder;
  $("holdLabel").textContent = ui.hold;
  $("endTitle").textContent = ui.end;
  $("homeBtn").setAttribute("aria-label", ui.home + " (" + ui.hold + ")");
  $("endHomeBtn").setAttribute("aria-label", ui.home);
  $("repeatBtn").setAttribute("aria-label", ui.repeat);
  $("againBtn").setAttribute("aria-label", ui.again);

  $("cards").innerHTML = C.scenes.map((s) =>
    `<button class="card" data-scene="${s.id}" style="background:${s.color}"><span class="e">${s.icon}</span>${s.title}</button>`).join("");
  document.querySelectorAll(".card").forEach((c) =>
    c.addEventListener("click", () => { unlockAudio(); startScene(C.scenes.find((s) => s.id === c.dataset.scene)); })
  );

  $("loading").remove();
  show("menu");
}

$("repeatBtn").addEventListener("click", () => { unlockAudio(); if (!busy && target()) { say([voice("ask_" + target().id)]); armHints(); } });
$("againBtn").addEventListener("click", () => { unlockAudio(); startScene(scene || C.scenes[0]); });
$("endHomeBtn").addEventListener("click", goHome);

// Home in a scene needs a 1.2 s press-and-hold, so little fingers don't leave by accident.
(() => {
  const btn = $("homeBtn");
  let t = null;
  const cancel = () => { clearTimeout(t); t = null; btn.classList.remove("holding"); };
  btn.addEventListener("pointerdown", (e) => {
    e.preventDefault();
    btn.classList.add("holding");
    t = setTimeout(() => { cancel(); goHome(); }, 1200);
  });
  ["pointerup", "pointerleave", "pointercancel"].forEach((ev) => btn.addEventListener(ev, cancel));
})();

// Grown-up name field
(() => {
  const input = $("nameInput");
  input.value = childName();
  input.addEventListener("input", () => {
    try { localStorage.setItem("childName", input.value.trim()); } catch {}
  });
})();

document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { stopAudio(); clearHints(); }
  // Coming back: whatever was interrupted, simply ask the current question again.
  else if ($("scene").classList.contains("on") && target()) { busy = false; ask(); }
});

init();

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  // When an updated version takes over, reload once so the new version shows.
  const hadController = !!navigator.serviceWorker.controller;
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloaded) { reloaded = true; location.reload(); }
  });
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
